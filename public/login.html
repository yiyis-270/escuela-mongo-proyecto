<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EscuelaMongo - Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>📚 EscuelaMongo</h1>
            <p>Sistema de Gestión de Alumnos</p>
        </div>
        <div class="login-body">
            <form id="loginForm">
                <div class="form-group">
                    <label> Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label> Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <div id="message" class="message"></div>
            <div class="demo-link">
                
            </div>
        </div>
    </div>

    <script>
        function fillDemo() {
            document.getElementById('email').value = 'alumno@demo.com';
            document.getElementById('password').value = '123456';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            messageDiv.className = 'message';
            messageDiv.style.display = 'none';
            
            if (!email || !password) {
                messageDiv.textContent = '❌ Por favor, completa todos los campos';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.mensaje || 'Error al iniciar sesión');
                }
                
                localStorage.setItem('token', data.token);
                localStorage.setItem('rol', data.rol);
                localStorage.setItem('nombre', data.nombre);
                localStorage.setItem('email', data.email);
                
                messageDiv.textContent = '✅ ¡Bienvenido ' + data.nombre + '! Redirigiendo...';
                messageDiv.className = 'message success';
                messageDiv.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = data.rol === 'admin' ? '/admin.html' : '/alumnos.html';
                }, 1500);
                
            } catch (error) {
                messageDiv.textContent = '❌ ' + error.message;
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
