<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Personal - Escuela</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h1>Registrar Personal</h1>
            <p>Asigna roles de Administrador o Profesor</p>
        </div>
        <div class="login-body">
            <form id="admin-registro-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña Temporal</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="rol">Asignar Rol</label>
                    <select id="rol" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ddd;">
                        <option value="profesor">Profesor</option>
                        <option value="admin">Administrador</option>
                        <option value="alumno">Alumno (Manual)</option>
                    </select>
                </div>
                <button type="submit">Registrar Usuario</button>
            </form>
            <div id="mensaje" class="message"></div>
            <div class="demo-link">
                <a href="alumnos.html">Volver al Dashboard</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('admin-registro-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loader = document.getElementById('loader');
            const data = {
                nombre: document.getElementById('nombre').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                rol: document.getElementById('rol').value
            };
            const token = localStorage.getItem("token");
            try {
                loader.style.display = 'flex';
                const res = await fetch('/api/users/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                const msg = document.getElementById('mensaje');
                msg.textContent = result.mensaje || result.error;
                msg.style.display = "block";
                msg.className = res.ok ? "message success" : "message error";
                if(res.ok) e.target.reset();
            } catch (error) {
                console.error(error);
            } finally {
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
