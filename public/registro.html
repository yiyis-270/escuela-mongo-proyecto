<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Escuela</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h1>Crear Cuenta</h1>
            <p>Únete a nuestra plataforma educativa</p>
        </div>
        <div class="login-body">
            <form id="registro-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <div class="form-group">
                    <label for="rol">Tipo de Usuario</label>
                    <select id="rol" style="width: 100%; padding: 12px; border: 2px solid #e1e5e9; border-radius: 10px; outline: none; font-size: 14px;">
                        <option value="alumno">Alumno</option>
                    </select>
                </div>
                <button type="submit">Registrar Usuario</button>
            </form>

            <div id="mensaje" class="message"></div>

            <div class="demo-link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </div>
        </div>
    </div>
    <script src="js/registro.js"></script>
</body>
</html>
